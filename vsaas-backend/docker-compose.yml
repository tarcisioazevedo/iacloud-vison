version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: icv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icvuser
      POSTGRES_PASSWORD: icvpass
      POSTGRES_DB: iacloudvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icvuser -d iacloudvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (cache / rate-limit store futuro) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: icv_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── Backend VSaaS ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: icv_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://icvuser:icvpass@postgres:5432/iacloudvision
      NODE_ENV: development
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-service-account.json
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src             # hot-reload em dev
      - ./prisma:/app/prisma
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro

  # ── Evolution API (WhatsApp Business) ────────────────────────────────────
  # Interface: http://localhost:8080  (Manager UI + REST API)
  # Autenticação: header "apikey: <EVOLUTION_API_KEY>"
  # Para subir: docker compose up -d evolution
  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: icv_evolution
    restart: unless-stopped
    environment:
      SERVER_URL: http://localhost:8080
      CORS_ORIGIN: "*"
      CORS_METHODS: "POST,GET,PUT,DELETE"
      CORS_CREDENTIALS: "true"
      # Autenticação por API Key global
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-icv_evolution_secret}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Banco de dados (schema separado para não poluir o principal)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://icvuser:icvpass@postgres:5432/iacloudvision
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Redis para cache de sessão
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      # Log
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
      # QR Code
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#198754"
      # Instâncias
      DEL_INSTANCE: "false"
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["whatsapp"]   # sobe com: docker compose --profile whatsapp up -d

  # ── Prisma Studio (opcional — UI do banco) ────────────────────────────────
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icv_prisma_studio
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://icvuser:icvpass@postgres:5432/iacloudvision
    ports:
      - "5555:5555"
    profiles: ["studio"]         # só sobe com: docker compose --profile studio up

volumes:
  postgres_data:
  evolution_instances:
