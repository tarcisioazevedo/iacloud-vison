<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="#0C2044"/>
  <!-- Synaptic Cloud Mark - centered -->
  <g transform="translate(100, 120)">
    <!-- Glow base -->
    <ellipse cx="156" cy="160" rx="110" ry="80" fill="#1B70C4" opacity="0.08"/>
    <!-- Nodes -->
    <circle cx="100" cy="110" r="32" fill="#1B70C4"/>
    <circle cx="210" cy="80" r="24" fill="#3B9AE8"/>
    <circle cx="240" cy="160" r="20" fill="#1B70C4" opacity="0.75"/>
    <circle cx="70" cy="190" r="18" fill="#3B9AE8" opacity="0.65"/>
    <circle cx="180" cy="210" r="15" fill="#1B70C4" opacity="0.55"/>
    <!-- Connections -->
    <line x1="100" y1="110" x2="210" y2="80" stroke="#1B70C4" stroke-width="5" opacity="0.35"/>
    <line x1="100" y1="110" x2="240" y2="160" stroke="#1B70C4" stroke-width="4" opacity="0.25"/>
    <line x1="100" y1="110" x2="70" y2="190" stroke="#3B9AE8" stroke-width="4" opacity="0.3"/>
    <line x1="210" y1="80" x2="240" y2="160" stroke="#3B9AE8" stroke-width="5" opacity="0.35"/>
    <line x1="70" y1="190" x2="180" y2="210" stroke="#1B70C4" stroke-width="4" opacity="0.25"/>
    <line x1="240" y1="160" x2="180" y2="210" stroke="#3B9AE8" stroke-width="4" opacity="0.25"/>
  </g>
  <!-- Text: IA -->
  <text x="256" y="420" text-anchor="middle" font-family="'Exo 2', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="100" fill="#FFFFFF" letter-spacing="-2">IA</text>
</svg>
