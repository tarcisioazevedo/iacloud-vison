version: '3.9'

# =============================================================================
# IA Cloud Vision — Docker Swarm Stack
# Deploy: ./deploy.sh
# Update:  docker stack deploy -c docker-stack.yml icv --with-registry-auth
# Remove:  docker stack rm icv
# Logs:    docker service logs icv_backend -f
# =============================================================================

networks:
  icv_net:
    driver: overlay
    attachable: true   # permite `docker run --network icv_net` para debug

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_instances:
    driver: local
  mqtt_data:
    driver: local
  mqtt_log:
    driver: local

configs:
  mosquitto_conf:
    file: ./vsaas-backend/mosquitto/mosquitto.conf

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
  db_password:
    file: ./secrets/db_password.txt

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icvuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: iacloudvision
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - icv_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # stateful — sempre no mesmo nó
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icvuser -d iacloudvision"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - icv_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MQTT Broker ─────────────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    ports:
      - target: 1883
        published: 1883
        mode: host      # mode host para menor latência de IoT
    networks:
      - icv_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # ── Backend VSaaS ───────────────────────────────────────────────────────────
  backend:
    image: icv_backend:latest   # construído pelo deploy.sh
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://icvuser:icvpass@postgres:5432/iacloudvision
      DIRECT_URL: postgresql://icvuser:icvpass@postgres:5432/iacloudvision
      JWT_EXPIRES_IN: "8h"
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX_REQUESTS: "200"
      GCP_PROJECT_ID: iacloud-vision-prod
      GCP_LOCATION: us-central1
      GCS_EVIDENCE_BUCKET: iacloud-evidence-raw
      GCS_EVIDENCE_TTL_HOURS: "72"
      VERTEX_VISION_ENDPOINT: visionai.googleapis.com
      VERTEX_VISION_LOCATION: us-central1
      BQ_DATASET_DEFAULT: iacloud_analytics
      SMTP_HOST: mail.iacloud.com.br
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: iacloudvision@iacloud.com.br
      SMTP_FROM: "IA Cloud Vision <iacloudvision@iacloud.com.br>"
      PUBLIC_FRONTEND_URL: https://app.iacloud.com.br/login
      PUBLIC_BACKEND_URL: https://app.iacloud.com.br/api
      EVOLUTION_API_URL: http://icv_evolution:8080
      EVOLUTION_API_KEY: icv_evolution_secret
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_sa   # S1: adicionar secret GCP
    secrets:
      - jwt_secret
      - smtp_pass
      - db_password
    volumes:
      - ./vsaas-backend/gcp-service-account.json:/run/secrets/gcp_sa:ro
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    networks:
      - icv_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend VSaaS ──────────────────────────────────────────────────────────
  frontend:
    image: icv_frontend:latest   # construído pelo deploy.sh
    environment:
      NODE_ENV: production
    ports:
      - target: 5173
        published: 5173
        mode: ingress
    networks:
      - icv_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 256M
