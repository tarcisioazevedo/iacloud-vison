version: '3.9'

# =============================================================================
# IA Cloud Vision — Docker Swarm Stack
# Deploy: ./deploy.sh
# Update:  docker stack deploy -c docker-stack.yml vsaas
# Remove:  docker stack rm vsaas
# Logs:    docker service logs vsaas_backend -f
#
# VPS: Hetzner CPX42 — 8 vCPU / 16 GB RAM
# Capacidade estimada:
#   - 150-200 câmeras com streaming simultâneo (gargalo: ~400 Mbps banda)
#   - 500+ câmeras cadastradas
#   - ~50.000 eventos/hora
# Alocação de memória (limites):
#   backend 4096M + go2rtc 4096M + postgres 1536M + redis 512M
#   + mediamtx 768M + evolution 512M + mqtt 256M + frontend 256M + pgbouncer 128M
#   ≈ 12.1 GB → deixa ~3.9 GB para OS, Docker overhead e picos
# =============================================================================

networks:
  icv_net:
    driver: overlay
    attachable: true   # permite `docker run --network icv_net` para debug

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_instances:
    driver: local
  mqtt_data:
    driver: local
  mqtt_log:
    driver: local
configs:
  mosquitto_conf:
    file: ./vsaas-backend/mosquitto/mosquitto.conf
  vsaas_go2rtc_config_v1778710478:
    external: true
  vsaas_mediamtx_config_v1778710478:
    external: true

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
  db_password:
    file: ./secrets/db_password.txt
  vapid_public:
    file: ./secrets/vapid_public.txt
  vapid_private:
    file: ./secrets/vapid_private.txt
  icv_encryption_key:
    file: ./secrets/icv_encryption_key.txt
  evolution_api_key:
    file: ./secrets/evolution_api_key.txt
  r2_access_key_id:
    file: ./secrets/r2_access_key_id.txt
  r2_secret_access_key:
    file: ./secrets/r2_secret_access_key.txt
  # Secrets externos — criados via `docker secret create iacloud_<nome> ...`
  # (não vão para git, gerenciados manualmente no Swarm).
  vsaas_cloudflare_api_token:
    external: true
  vsaas_cloudflare_account_id:
    external: true
  vsaas_cloudflare_zone_id:
    external: true
  ai_worker_secret:
    external: true
  vsaas_srt_publish_passphrase:
    external: true

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16   # era postgres:16-alpine — trocado 2026-05-14 pra habilitar pgvector HNSW
    # Tuning para 1536M RAM alocado: shared_buffers=25%, effective_cache=75%
    command: >
      postgres
      -c shared_buffers=384MB
      -c effective_cache_size=1152MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: icvuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: vsaas
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      icv_net:
        aliases:
          - postgres
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # stateful — sempre no mesmo nó
      restart_policy:
        condition: any            # restart sempre (incl. reboots seguidos do host)
        delay: 10s
        # max_attempts removido: reboots seguidos do host não devem zerar o serviço
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icvuser -d vsaas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PgBouncer (Pool de Conexões Postgres) ──────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: icvuser
      # edoburu/pgbouncer suporta _FILE nativamente — lê da montagem do secret
      DB_PASSWORD_FILE: /run/secrets/db_password
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    secrets:
      - db_password
    networks:
      icv_net:
        aliases:
          - pgbouncer
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 128M
    depends_on:
      - postgres
    # Healthcheck via TCP no socket interno do pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 384mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      icv_net:
        aliases:
          - redis
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MQTT Broker ─────────────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    ports:
      - target: 1883
        published: 1883
        mode: host      # mode host para menor latência de IoT
      - target: 9001
        published: 9001
        mode: host      # WebSocket para dashboard web
    networks:
      - icv_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    # mosquitto_sub no tópico $SYS/broker/uptime — sempre responde se broker vivo
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -W 3 -C 1 -q 0 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:v2.2.3
    environment:
      SERVER_URL: https://evolution.vsaas.com.br
      CORS_ORIGIN: "*"
      CORS_METHODS: "POST,GET,PUT,DELETE"
      CORS_CREDENTIALS: "true"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: icv_evolution_secret
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # IMPORTANTE: Evolution usa DB DEDICADA (`evolution_db`) — não compartilha com `iacloudvision`.
      # Ele tem ~50 migrations próprias (Instance, IntegrationSession, Setting, Chat, Message, etc.)
      # que coalisariam com o schema do nosso VSaaS se rodassem na mesma DB.
      # Migration aplicada em prod 2026-05-06 (vide handoff do dia).
      DATABASE_CONNECTION_URI: postgresql://icvuser:6NuBX8WPEmpWbknN72VrggacUQsxdLytPM1fDZxnGz4%3D@postgres:5432/evolution_db
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#198754"
      DEL_INSTANCE: "false"
      # Força Node.js a preferir IPv4 no DNS — a faixa IPv6 da Hetzner (2a01:4f8::/32)
      # está bloqueada pelo WhatsApp como datacenter IP, causando falha no handshake
      # do Baileys (noise-handler). Com ipv4first o Baileys conecta via 23.88.124.67.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - target: 8080
        published: 8081
        mode: host
    networks:
      icv_net:
        aliases:
          - evolution
    deploy:
      # DESLIGADO (2026-05-14): WhatsApp bloqueia noise handshake do IP 23.88.124.67.
      # Backend agora aponta pra Evolution na VPS 168.119.153.216 (evolution.acesso.iacloud.com.br),
      # que tem a sessão `iacloud_internal` autenticada. Ver EVOLUTION_API_URL no backend.
      # Mantemos o bloco do serviço aqui para preservar config caso queiramos religar.
      replicas: 0
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: 512M
    # Evolution API expõe / com 200 (ou redirect). Funciona como health TCP+HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Backend VSaaS ───────────────────────────────────────────────────────────
  backend:
    image: icv_backend:latest   # construído pelo deploy.sh
    environment:
      NODE_ENV: production
      # Controla heap V8 do Node.js — GC antes de atingir o limite do container (4096M)
      # Deixa ~512M de headroom para buffers nativos, RSS não-heap e libuv.
      NODE_OPTIONS: "--max-old-space-size=3584"
      # G11 fix (2026-05-09): força UTC. ffmpeg `-strftime 1` usa localtime do
      # container; sem TZ=UTC os paths .ts ficavam com fuso BR enquanto o DB
      # guardava UTC, gerando inconsistência sutil entre filesystem e DB.
      TZ: UTC
      PORT: "3000"
      # DATABASE_URL/DIRECT_URL agora montados em runtime via secrets-bootstrap.ts
      # a partir de DATABASE_URL_TEMPLATE + DB_PASSWORD_FILE (Docker secret).
      # Trocar a senha = trocar arquivo secrets/db_password.txt + redeploy.
      #
      # ATENÇÃO ao `$$`: Docker Compose interpola `${VAR}` no parse do YAML
      # usando env do shell. Como DB_PASSWORD não existe no shell do host,
      # `${DB_PASSWORD}` literal vira string vazia. `$$` escapa pra `$`,
      # preservando o template `${DB_PASSWORD}` no container, onde então
      # o secrets-bootstrap.ts substitui pelo valor lido do _FILE.
      DATABASE_URL_TEMPLATE: 'postgresql://icvuser:$${DB_PASSWORD}@postgres:5432/vsaas'
      DIRECT_URL_TEMPLATE:   'postgresql://icvuser:$${DB_PASSWORD}@postgres:5432/vsaas'
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_IN: "8h"
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX_REQUESTS: "200"
      GCP_PROJECT_ID: gen-lang-client-0913190127
      GCP_LOCATION: us-central1
      GCS_EVIDENCE_BUCKET: iacloud-evidence-raw
      GCS_EVIDENCE_TTL_HOURS: "72"
      VERTEX_VISION_ENDPOINT: visionai.googleapis.com
      VERTEX_VISION_LOCATION: us-central1
      BQ_DATASET_DEFAULT: iacloud_analytics
      SMTP_HOST: mail.iacloud.com.br
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: iacloudvision@iacloud.com.br
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      # SMTP_FROM é VISÍVEL pra usuário final em todos os e-mails enviados
      # (recuperação senha, notificações, convites). Manter caixa real
      # `iacloudvision@iacloud.com.br` ATÉ rotação P0 + caixa nova ser provisionada.
      # Quando trocar pra `noreply@vsaas.com.br`, ver docs/PLAN-RENAME-VSAAS.md Fase 5.
      SMTP_FROM: "VSaaS <iacloudvision@iacloud.com.br>"
      PUBLIC_FRONTEND_URL: https://app.vsaas.com.br/login
      PUBLIC_BACKEND_URL: https://app.vsaas.com.br/api
      # Evolution API roda em VPS dedicado (168.119.153.216) pois o IP 23.88.124.67
      # está bloqueado pelo WhatsApp no noise handshake. Sessão `iacloud_internal`
      # já autenticada lá (557131900545). Histórico: docs/handoff 2026-05-14.
      EVOLUTION_API_URL: https://evolution.acesso.iacloud.com.br
      EVOLUTION_API_KEY_FILE: /run/secrets/evolution_api_key
      RTMP_INGEST_PUBLIC_HOST: app.vsaas.com.br
      RTMP_INGEST_PUBLIC_PORT: "1935"
      GO2RTC_API_URL: http://go2rtc:1984
      EMBEDDED_GO2RTC_URL: http://go2rtc:1984
      MEDIAMTX_INTERNAL_URL: http://mediamtx:8889
      # Passphrase SRT publish — backend lê do secret e retorna em /iacv-box/srt-config
      SRT_PUBLISH_PASSPHRASE_FILE: /run/secrets/vsaas_srt_publish_passphrase
      ICV_ENCRYPTION_KEY_FILE: /run/secrets/icv_encryption_key
      AI_WORKER_SECRET_FILE: /run/secrets/ai_worker_secret
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_sa   # S1: adicionar secret GCP
      VAPID_PUBLIC_KEY_FILE:  /run/secrets/vapid_public
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private
      VAPID_SUBJECT: mailto:iacloudvision@iacloud.com.br
      # Cloudflare R2 Multi-Tenant Storage (bucket-per-integrador)
      # Account ID NÃO é secret (público no painel CF) — mantém inline.
      R2_ACCOUNT_ID: "3f5ec041eda55f11f99f5b96f600378e"
      R2_ACCESS_KEY_ID_FILE:     /run/secrets/r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      R2_ENDPOINT: "https://3f5ec041eda55f11f99f5b96f600378e.r2.cloudflarestorage.com"
      R2_BUCKET_PREFIX: "icv"
      # Gravação contínua — LIGADA (2026-05-12).
      # Onda 1+2+3 entregues. EDGE_BOX desabilitado, focando produção em
      # CLOUD_DIRECT (RTMP_PUSH) com defensive validations no place
      # (validateAndNormalizeStartedAt, lastOnlineAt, retention SQL).
      RECORDING_ENABLED: "true"
      RECORDINGS_BASE_PATH: /recordings
      RECORDING_SEGMENT_SECONDS: "10"
      RECORDING_POLL_MS: "4000"
      GO2RTC_RTSP_URL: rtsp://go2rtc:8554
      # Redis — estado distribuído de gravação (Fase 1 escala).
      # Compartilhado com Evolution API (prefixo 'icv:' separa namespaces).
      REDIS_URL: redis://redis:6379
      # Hetzner Object Storage (S3-compatible) para gravações
      # Endpoint por região: fsn1/nbg1/hel1.your-objectstorage.com
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-fsn1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_RECORDINGS_BUCKET: "${S3_RECORDINGS_BUCKET:-icv-recordings}"
      # Deleta arquivo local após upload S3 confirmado (economiza disco)
      RECORDING_DELETE_LOCAL_AFTER_S3: "true"
      # Cloudflare Tunnel — expõe go2rtc de Edge Boxes via tunnel seguro.
      # Credenciais via Docker Swarm secrets (não em plaintext) — service lê <NAME>_FILE.
      CLOUDFLARE_ACCOUNT_ID_FILE: /run/secrets/vsaas_cloudflare_account_id
      CLOUDFLARE_API_TOKEN_FILE:  /run/secrets/vsaas_cloudflare_api_token
      CLOUDFLARE_ZONE_ID_FILE:    /run/secrets/vsaas_cloudflare_zone_id  # CNAMEs *.tunnels.vsaas.com.br
    secrets:
      - jwt_secret
      - smtp_pass
      - db_password
      - vapid_public
      - vapid_private
      - icv_encryption_key
      - evolution_api_key
      - r2_access_key_id
      - r2_secret_access_key
      - vsaas_cloudflare_api_token
      - vsaas_cloudflare_account_id
      - vsaas_cloudflare_zone_id
      - vsaas_srt_publish_passphrase
      - ai_worker_secret
    volumes:
      - ./vsaas-backend/gcp-service-account.json:/run/secrets/gcp_sa:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/update-go2rtc-config.sh:/app/scripts/update-go2rtc-config.sh:ro
      - type: tmpfs
        target: /recordings
        tmpfs:
          size: 4294967296   # 4 GB RAM — ~267 câmeras FHD simultâneas por tick
    ports:
      - target: 3000
        published: 3000
        mode: ingress    # ingress permite N réplicas (load balancing VIP)
    networks:
      - icv_net
    deploy:
      replicas: 2        # Fase 1 escala: 2 réplicas com Redis state
      placement:
        constraints: [node.role == manager]
        # max_replicas_per_node não é necessário (Swarm single-node);
        # Swarm distribui automaticamente quando workers forem adicionados.
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: stop-first    # killOrphans filtra ppid=1 — start-first é seguro
                             # mas stop-first garante zero gap de gravação (recomendado)
      rollback_config:
        parallelism: 1
        failure_action: pause
      resources:
        limits:
          memory: 4096M
          cpus: '2.5'    # teto por réplica; 3 réplicas = 7.5 de 8 vCPUs máximo
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── go2rtc (RTMP ingest + WebRTC/HLS streaming) ─────────────────────────────
  go2rtc:
    image: alexxit/go2rtc:latest
    configs:
      - source: vsaas_go2rtc_config_v1778710478
        target: /config/go2rtc.yaml
    ports:
      - target: 1935
        published: 1935
        mode: host      # RTMP ingest — câmeras empurram aqui
      - target: 1984
        published: 1984
        mode: host      # API interna
      - target: 8554
        published: 8554
        mode: host      # RTSP out
      - target: 8555
        published: 8555
        protocol: udp
        mode: host      # WebRTC UDP
      - target: 8555
        published: 8555
        protocol: tcp
        mode: host      # WebRTC TCP fallback
      # Nota: SRT NÃO é exposto pelo go2rtc 1.9.x (sem suporte nativo).
      # Quem aceita SRT push é o iacloud_mediamtx na porta 8890/UDP.
    networks:
      icv_net:
        aliases:
          - go2rtc
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 256M
    # go2rtc API responde JSON em /api/streams sempre (mesmo vazio = "{}")
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:1984/api/streams >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Frontend VSaaS ──────────────────────────────────────────────────────────
  frontend:
    image: icv_frontend:latest   # construído pelo deploy.sh
    environment:
      NODE_ENV: production
    ports:
      - target: 8080
        published: 8082
        mode: host
    networks:
      - icv_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        # stop-first OBRIGATÓRIO em mode:host — start-first causa
        # "host-mode port already in use" pois ambas as tasks tentam
        # bind no mesmo :8082 do host (auditoria 2026-05-14 F1).
        order: stop-first
      resources:
        limits:
          memory: 256M
    # Healthcheck: nginx serve / com 200 (SPA fallback do try_files)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── MediaMTX — SFU para SRT (uplink Box→Cloud, baixa latência) + WebRTC saída ───
  mediamtx:
    image: bluenviron/mediamtx:1.18.1-ffmpeg
    configs:
      - source: vsaas_mediamtx_config_v1778710478
        target: /mediamtx.yml
    volumes:
      - ./assets:/assets:ro  # placeholder vídeos (camera-offline.mp4)
    secrets:
      - source: vsaas_srt_publish_passphrase
        target: srt_publish_passphrase
    # Entrypoint wrapper: lê secret do arquivo, exporta como env MTX_*, exec mediamtx.
    # MediaMTX 1.18+ aceita override de config via env MTX_<UPPERCASE_KEY>.
    # `srtPublishPassphrase` (camel) → MTX_SRTPUBLISHPASSPHRASE.
    entrypoint:
      - sh
      - -c
      - |
        # MediaMTX env var sintaxe: MTX_<NESTED_KEY> com `_` separando níveis.
        # `pathDefaults.srtPublishPassphrase` → MTX_PATHDEFAULTS_SRTPUBLISHPASSPHRASE
        export MTX_PATHDEFAULTS_SRTPUBLISHPASSPHRASE=$$(cat /run/secrets/srt_publish_passphrase 2>/dev/null || echo "")
        if [ -z "$$MTX_PATHDEFAULTS_SRTPUBLISHPASSPHRASE" ]; then
          echo "WARN: srt_publish_passphrase secret empty — SRT will accept any client (DEV ONLY)"
        else
          echo "INFO: SRT publish passphrase loaded ($${#MTX_PATHDEFAULTS_SRTPUBLISHPASSPHRASE} chars) — applied to pathDefaults"
        fi
        exec /mediamtx /mediamtx.yml
    ports:
      - target: 8890
        published: 8890
        protocol: udp
        mode: host          # SRT listener — Box empurra streams aqui
      - target: 8889
        published: 8889
        protocol: tcp
        mode: host          # WebRTC HTTP signaling (WHEP)
      - target: 8189
        published: 8189
        protocol: udp
        mode: host          # WebRTC ICE / RTP UDP
      - target: 8888
        published: 8888
        protocol: tcp
        mode: host          # HLS LL fallback
      - target: 8556
        published: 8556
        protocol: tcp
        mode: host          # RTSP (legado/compat) — 8554 já é go2rtc
    networks:
      icv_net:
        aliases:
          - mediamtx
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 768M
    # MediaMTX API responde em :9997. Path /v3/paths/list sempre 200.
    # (auth restrita a 127.0.0.1 + redes Docker já no config — passa do container)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:9997/v3/paths/list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── vsaas-ai-worker (YOLO inference — roda no nó role=inference) ─────────
  ai_worker:
    image: vsaas-ai-worker:latest
    networks:
      - icv_net
    environment:
      BACKEND_URL: "http://backend:3000"
      GO2RTC_RTSP_BASE: "rtsp://go2rtc:8554"
      SAMPLE_FPS: "3"
      BATCH_INTERVAL: "5"
      CAMERA_REFRESH_SEC: "300"
      YOLO_MODEL: "yolov8n.pt"
    secrets:
      - source: ai_worker_secret
        target: ai_worker_secret
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == inference
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
