  # ── MediaMTX (RTMP/SRT/WebRTC/HLS ingest) ────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.18.1-ffmpeg
    networks:
      icv_net:
        aliases: [mediamtx]
    ports:
      - target: 1935
        published: 1935
        protocol: tcp
        mode: host
      - target: 8189
        published: 8189
        protocol: udp
        mode: host
      - target: 8556
        published: 8556
        protocol: tcp
        mode: host
      - target: 8888
        published: 8888
        protocol: tcp
        mode: host
      - target: 8889
        published: 8889
        protocol: tcp
        mode: host
      - target: 8890
        published: 8890
        protocol: udp
        mode: host
    volumes:
      - /opt/iacloud-vison/assets:/assets
    configs:
      - source: mediamtx_config
        target: /mediamtx.yml
    secrets:
      - source: vsaas_srt_publish_passphrase
        target: srt_publish_passphrase
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 768M
      update_config:
        parallelism: 1
        failure_action: pause
        monitor: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s

  # ── MQTT Broker (Mosquitto) ───────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0.21
    networks:
      icv_net:
        aliases: [mqtt]
    ports:
      - target: 1883
        published: 1883
        protocol: tcp
        mode: host
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 256M
      update_config:
        parallelism: 1
        failure_action: pause
        monitor: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
  # Evolution API local removida do stack de producao em 2026-08-13.
  # Backend usa o gateway externo definido por EVOLUTION_API_URL.
  # O volume evolution_instances foi preservado para recuperacao controlada.

  roboflow_inference:
    image: roboflow/roboflow-inference-server-cpu:0.44.0
    networks:
      icv_net:
        aliases: [roboflow_inference]
    volumes:
      - roboflow_cache:/cache
    environment:
      MODEL_CACHE_DIR: /cache
      ROBOFLOW_API_KEY_FILE: /run/secrets/roboflow_api_key
      DISABLE_INFERENCE_CACHE: "false"
      LOG_LEVEL: WARNING
    secrets:
      - source: roboflow_api_key
        target: roboflow_api_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == inference
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
      update_config:
        parallelism: 1
        failure_action: pause
        monitor: 5s
        order: stop-first

  # ── AI Worker (Python — YOLO + tracking) ─────────────────────────────────
  ai_worker:
    image: ${VSAAS_AI_WORKER_IMAGE:-vsaas-ai-worker:e43436e05}
    networks:
      icv_net:
        aliases: [ai_worker]
    environment:
      BACKEND_URL: http://backend:3000
      REDIS_URL: redis://redis:6379
      GO2RTC_RTSP_BASE: rtsp://go2rtc:8554
      ROBOFLOW_INFERENCE_URL: http://roboflow_inference:9001
      YOLO_BACKEND: roboflow
      YOLO_MODEL: yolo11m.pt
      YOLO_BASE_CONF: "0.15"
      YOLO_IMGSZ: "1280"
      YOLO_IOU: "0.50"
      ROBOFLOW_MODEL_ID: coco/3
      SAMPLE_FPS: "10"
      BATCH_INTERVAL: "5"
      CAMERA_REFRESH_SEC: "300"
      CLAHE_ENABLED: "true"
      CLAHE_LUMA_THRESHOLD: "90"
      LIVE_PUB_ENABLED: "true"
      LIVE_PUB_MIN_INTERVAL_MS: "50"
      LIVE_PUB_REQUIRE_TRACK: "false"
      MAX_DISAPPEARED: "5"
      MIN_INITIALIZED: "1"
      CONFIRM_THRESHOLD: "0.35"
      # Tracker backend: bytetrack (boxmot) ou norfair (legado).
      # ByteTrack: -50% ID switches, -30% fragments. Custo extra ~1-2ms/frame.
      # Rollback rápido: trocar pra "norfair" + service update.
      TRACKER_BACKEND: "bytetrack"
      CONFIDENCE_PER_CLASS: '{"person":0.30,"motorcycle":0.30,"bicycle":0.25,"car":0.35,"truck":0.35,"bus":0.35}'
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "fflags;nobuffer|flags;low_delay|reorder_queue_size;0"
    secrets:
      - source: ai_worker_secret
        target: ai_worker_secret
      - source: roboflow_api_key
        target: roboflow_api_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == inference
      resources:
        limits:
          cpus: "7.5"
          memory: 8192M
      update_config:
        parallelism: 1
        failure_action: pause
        monitor: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
