<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- ── Theme boot script — DEVE rodar ANTES de qualquer CSS ──────────
         Lê localStorage e aplica `class="dark"` no <html> ANTES do React
         montar. Sem isso, o usuário com tema light salvo veria flash dark
         no primeiro paint (FOUC). Default: dark se nunca escolheu. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('icv-theme');
          if (t !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Storage bloqueado (modo anônimo restrito) → default dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Brand ───────────────────────────────────────────────────── -->
    <title>VSaaS — Videomonitoramento inteligente como serviço</title>
    <meta name="application-name" content="VSaaS" />
    <meta name="description" content="VSaaS — Videomonitoramento inteligente como serviço. Plataforma B2B2B com IA on-device, reconhecimento facial, LPR, analytics e gestão multi-tenant de câmeras IP." />
    <meta name="keywords" content="VSaaS, videomonitoramento, CFTV cloud, IA, reconhecimento facial, LPR, analytics, segurança eletrônica, edge box" />
    <meta name="author" content="VSaaS" />

    <!-- ── Favicon & Icons ─────────────────────────────────────────── -->
    <!-- SVG favicon — escala perfeita em qualquer resolução -->
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <!-- Fallback PNG para browsers sem suporte a SVG favicon -->
    <link rel="icon" href="/brand/favicon.png" sizes="256x256" type="image/png" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/favicon.png" />

    <!-- ── PWA ─────────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#011118" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VSaaS" />
    <meta name="msapplication-TileColor" content="#011118" />
    <meta name="msapplication-TileImage" content="/brand/favicon.png" />

    <!-- ── Open Graph (WhatsApp, LinkedIn, etc.) ──────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VSaaS — Videomonitoramento inteligente como serviço" />
    <meta property="og:description" content="Plataforma VSaaS B2B2B com IA on-device — analytics em tempo real, reconhecimento facial, LPR e heatmaps para integradores de segurança eletrônica." />
    <meta property="og:image" content="/brand/vsaas-wordmark.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- ── Fonts ───────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch(function (err) { console.warn('[icv] sw register failed', err); });
        });
      }
    </script>
  </body>
</html>
