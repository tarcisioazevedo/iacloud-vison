<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <linearGradient id="wmBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01B9D3"/>
      <stop offset="1" stop-color="#00C7A8"/>
    </linearGradient>
    <linearGradient id="wmLens" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#493C7F"/>
      <stop offset="1" stop-color="#01B9D3"/>
    </linearGradient>
    <radialGradient id="wmLensInner" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8E7BC4"/>
      <stop offset=".55" stop-color="#493C7F"/>
      <stop offset="1" stop-color="#1A0F3A"/>
    </radialGradient>
  </defs>

  <!-- Logomark compacto à esquerda -->
  <g transform="translate(0,5) scale(0.55)">
    <path d="
      M 35 65 C 35 35, 65 25, 85 35
      C 95 22, 125 22, 135 42
      C 155 38, 175 55, 168 75
      C 168 95, 152 110, 132 105
      C 122 122, 100 122, 90 110
      C 70 115, 50 100, 50 80
      C 38 80, 32 73, 35 65 Z"
      fill="none" stroke="url(#wmBrand)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="
      M 70 95 C 60 120, 90 135, 105 120
      C 115 110, 125 95, 140 95
      C 155 95, 165 105, 165 115
      C 165 130, 150 138, 135 132"
      fill="none" stroke="url(#wmBrand)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="100" r="22" fill="url(#wmLens)" stroke="url(#wmBrand)" stroke-width="3"/>
    <circle cx="150" cy="100" r="13" fill="url(#wmLensInner)"/>
    <circle cx="145" cy="95" r="5" fill="#fff" opacity=".7"/>
  </g>

  <!-- Wordmark "VSaaS" — sans bold geométrica -->
  <g transform="translate(125, 0)" font-family="'Manrope','Montserrat',sans-serif" font-weight="800">
    <text x="0" y="70" font-size="68" fill="url(#wmBrand)" letter-spacing="-2">V</text>
    <text x="55" y="70" font-size="62" fill="currentColor" letter-spacing="-2.5">SaaS</text>
  </g>

  <!-- Tagline opcional -->
  <text x="125" y="95" font-family="'Inter',sans-serif" font-size="11" fill="#8D9295" letter-spacing="0.5">
    Videomonitoramento inteligente como serviço
  </text>
</svg>
